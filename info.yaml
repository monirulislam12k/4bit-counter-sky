# Tiny Tapeout project information
project:
  title:        "4-bit Down Counter SKY"  # প্রজেক্টের নাম
  description:  "A synchronous 4-bit down counter using SkyWater 130nm" # বর্ণনা
  author:       "monirulislam12k"         # আপনার গিটহাব ইউজারনেম
  discord:      ""                        
  language:     "Verilog"
  clock_hz:     10000000                  # ১০ MHz

# How many tiles your design occupies?
tiles: "1x1"

# Your top level module name!
name: "tt_um_example"                     # 💡 আপনার মেইন মডিউলের সঠিক নাম

# Pinout documentation
pinout:
  # Inputs
  ui: "Enable Signal"
  ui: "Unused"
  ui: "Unused"
  ui: "Unused"
  ui: "Unused"
  ui: "Unused"
  ui: "Unused"
  ui: "Unused"

  # Outputs
  uo: "Count Bit 0"
  uo: "Count Bit 1"
  uo: "Count Bit 2"
  uo: "Count Bit 3"
  uo: "Unused"
  uo: "Unused"
  uo: "Unused"
  uo: "Unused"

  # Bidirectional pins
  uio: "Unused"
  uio: "Unused"
  uio: "Unused"
  uio: "Unused"
  uio: "Unused"
  uio: "Unused"
  uio: "Unused"
  uio: "Unused"

